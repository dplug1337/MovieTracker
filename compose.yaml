services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: movietracker
      POSTGRES_DB: movietracker
      POSTGRES_PASSWORD: ${MOVIETRACKER_DB_PASSWORD:?Set MOVIETRACKER_DB_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - movie-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movietracker -d movietracker"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  movie-data:
